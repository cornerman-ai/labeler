<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMBO Workout Review</title>
<meta name="description" content="Go through every lesson and workout in AMBO and say what worked.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<!-- Workout review: the team answers two questions on every drill of the app's courses, was everything clear and
     did everything work well; Your notes, Team notes (everyone's answers, the same menu) and Profile. The courses come from workouts.json, written from the app's own data by the ios repo's
     scripts/workout-review-data.mjs; the answers save to the shared Apps Script (doGetWorkoutReview), one row per
     person per drill, in the "Workout review notes" workbook. -->
<header class="nav">
  <div class="nav-in">
    <span class="brand">AMBO <span>Review</span></span>
    <nav class="tabs" aria-label="Menu">
      <a href="#" data-tab="mine">Your notes</a>
      <a href="#team" data-tab="team">Team notes</a>
      <a href="#profile" data-tab="profile">Profile</a>
    </nav>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<div class="sync" id="sync" role="status" aria-live="polite"></div>

<div class="modal-wrap" id="name-modal" hidden>
  <form class="modal" id="name-form">
    <h2>Who's reviewing?</h2>
    <p id="name-hint"></p>
    <input id="name-input" autocomplete="name" placeholder="Your name" maxlength="40" required>
    <button class="btn" type="submit">Continue</button>
  </form>
</div>

<script src="app.js?v=5"></script>
</body>
</html>

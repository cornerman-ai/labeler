<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torso Angle Labeler</title>
<style>
/* ── design system copied from chin_tuck_4.0/height_guard ──────────────────
   Same tokens, same card/pill/button language, same zoom-pan stage — see
   that file's own header comments for the reasoning behind each choice.
   What is NOT here: point placement, visibility popovers, admin mode,
   disagreement grids. This tool asks for one bucket per frame. */
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --line: rgba(0,0,0,.10);
  --ink: #1d1d1f;
  --ink-dim: #6e6e73;
  --accent: #0071e3;
  --yes: #34c759;
  --no: #ff3b30;
  --maybe: #ff9f0a;
  --radius: 12px;
  --open-bg: color-mix(in srgb, var(--accent) 13%, transparent);
  --open-line: color-mix(in srgb, var(--accent) 32%, transparent);
  --open-ink: color-mix(in srgb, var(--accent) 82%, black);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
  /* Wedge fills. Deliberately NOT --yes/--no: an angle bucket is not a
     verdict, so nothing here should read as "good" or "bad". */
  --wedge: rgba(120,120,128,.10);
  --wedge-hover: rgba(120,120,128,.20);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --line: rgba(255,255,255,.14);
    --ink: #f5f5f7; --ink-dim: #98989d; --accent: #0a84ff;
    --open-bg: color-mix(in srgb, var(--accent) 24%, transparent);
    --open-line: color-mix(in srgb, var(--accent) 45%, transparent);
    --open-ink: color-mix(in srgb, var(--accent) 55%, white);
    --shadow: 0 1px 2px rgba(0,0,0,.5);
    --wedge: rgba(120,120,128,.18);
    --wedge-hover: rgba(120,120,128,.30);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; transition: transform .1s ease; }
button:active:not(:disabled) { transform: scale(.96); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
  button:active:not(:disabled) { transform: none; }
}
kbd {
  font: 500 10.5px ui-monospace, "SF Mono", Menlo, monospace;
  background: rgba(120,120,128,.16); border-radius: 4px; padding: 1px 5px;
}

/* labeler_name.js prepends its own identity strip; here the name lives in
   the side panel instead, so the strip is hidden — same as height_guard. */
#cm-labeler-chip { display: none !important; }

#name-row { display: flex; gap: 6px; }
#labeler-input {
  display: block !important;   /* beats labeler_name.js's inline hide */
  flex: 1; min-width: 0;
  border: 0; border-radius: 9px;
  background: rgba(120,120,128,.12); color: var(--ink);
  padding: 9px 12px; font-size: 14px; font-weight: 500;
}
#labeler-input::placeholder { color: var(--ink-dim); font-weight: 400; }
#labeler-input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (prefers-color-scheme: dark) { #labeler-input { background: rgba(120,120,128,.24); } }
#name-go {
  flex: none; padding: 0 15px; border: 0; border-radius: 9px;
  background: var(--accent); color: #fff; font-size: 13px; font-weight: 590;
}
#name-go:disabled { opacity: .3; cursor: default; }
#name-row.saved #name-go { background: var(--yes); }
#name-row.saved #labeler-input {
  box-shadow: inset 0 0 0 1.5px var(--yes);
  background: color-mix(in srgb, var(--yes) 10%, transparent);
}

/* ── layout ─────────────────────────────────────────────────────────────── */
#wrap { display: flex; gap: 12px; padding: 16px 0 16px 16px;
        align-items: flex-start; height: 100vh; }
#stage-card {
  flex: 1; min-width: 0; height: 100%;
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; position: relative;
  display: flex; align-items: center; justify-content: center;
}
/* #stage carries the frame's aspect ratio (set from naturalWidth/Height on
   load) and the image fills it exactly — transform-origin 0 0 is what makes
   zoom-at-cursor solvable. Verbatim from height_guard. */
#stage { position: relative; display: block; max-width: 100%; max-height: 100%;
         aspect-ratio: 9 / 16; user-select: none; transform-origin: 0 0; }
#stage img { display: block; width: 100%; height: 100%; }
/* Past SHARP_MAG device pixels per source pixel the browser's smoothing is
   inventing pixels between the real ones. See magnification(). */
#stage.sharp img { image-rendering: pixelated; }
#stage.zoomed { cursor: grab; }
#stage.panning { cursor: grabbing; }
#hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px;
        color: rgba(255,255,255,.85); background: rgba(0,0,0,.45);
        padding: 3px 8px; border-radius: 6px; pointer-events: none; }
/* Only while zoomed — at fit there is nothing to reset and the chip is
   one more thing on screen saying nothing. */
#zoom-chip {
  position: absolute; right: 12px; bottom: 10px; display: none;
  align-items: center; gap: 7px; padding: 3px 5px 3px 9px; border-radius: 999px;
  background: rgba(0,0,0,.45); color: rgba(255,255,255,.9); font-size: 11px;
  font-variant-numeric: tabular-nums;
}
#stage-card.zoomed #zoom-chip { display: flex; }
#zoom-reset {
  border: 0; border-radius: 999px; padding: 2px 8px;
  background: rgba(255,255,255,.18); color: #fff; font-size: 10.5px; font-weight: 590;
}
#zoom-reset:hover { background: rgba(255,255,255,.3); }

#side { width: 342px; padding-right: 2px; flex: none; height: 100%;
        overflow-y: auto; scrollbar-gutter: stable;
        display: flex; flex-direction: column; gap: 12px;
        scrollbar-width: thin; scrollbar-color: rgba(120,120,128,.45) transparent; }
#side::-webkit-scrollbar { width: 8px; }
#side::-webkit-scrollbar-track { background: transparent; }
#side::-webkit-scrollbar-thumb { background: rgba(120,120,128,.45); border-radius: 4px; }
#side::-webkit-scrollbar-thumb:hover { background: rgba(120,120,128,.7); }

.card { background: var(--card); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 16px; }
.card-eyebrow {
  font-size: 11px; font-weight: 590; letter-spacing: .04em;
  text-transform: uppercase; color: var(--ink-dim); margin: 0 0 9px;
  grid-column: 1 / -1;
}

/* ── frame identity ──────────────────────────────────────────────────────
   Every part separately copyable — they get pasted into different places
   (a bug report, a spreadsheet filter, the source video). */
#id-card { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px;
           align-items: baseline; }
.idl { font-size: 11px; color: var(--ink-dim); }
.idv { min-width: 0; font: 500 11.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
       word-break: break-word; }   /* wrapped, not truncated — stems run long */
.idc {
  flex: none; padding: 2px; border: 0; border-radius: 5px; background: none;
  color: var(--ink-dim); line-height: 0; opacity: .5;
  transition: opacity .12s ease, color .12s ease;
}
.idc:hover, .idc:focus-visible { opacity: 1; color: var(--ink);
                                 background: rgba(120,120,128,.14); }
.idc.copied { opacity: 1; color: var(--yes); }
.idc.failed { opacity: 1; color: var(--no); }
.idc svg { width: 13px; height: 13px; display: block; }

/* ── the dial ────────────────────────────────────────────────────────────
   Eight 45°-wide SECTORS, not eight dots: the wedge IS the interval, so its
   width on screen is the answer's width. Boundary values are printed on the
   spokes between wedges (±22.5, ±67.5, …) and the CENTRE of each interval
   inside it — the two facts the bucket is defined by.
   Geometry: x = cx + R·sin θ, y = cy + R·cos θ, so 0° sits at the bottom
   (torso squared to camera), 180° at the top (back to camera), + = the
   camera's right. */
#dial-wrap { display: flex; justify-content: center; margin: 2px 0 4px; }
#dial { width: 300px; height: 300px; display: block; touch-action: none; }
.wedge {
  fill: var(--wedge); stroke: var(--card); stroke-width: 2;
  cursor: pointer; transition: fill .12s ease;
}
.wedge:hover { fill: var(--wedge-hover); }
.wedge.on { fill: var(--accent); }
.wedge:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2.5; }
.wlabel { pointer-events: none; fill: var(--ink); font-size: 13px; font-weight: 590;
          text-anchor: middle; dominant-baseline: central; }
.wkey { pointer-events: none; fill: var(--ink-dim); font-size: 9.5px; font-weight: 500;
        text-anchor: middle; dominant-baseline: central; }
/* Set by renderDial() on the label AND the key of the picked wedge — not a
   sibling selector, which would reach every later label in the group. */
.wlabel.on { fill: #fff; }
.wkey.on { fill: rgba(255,255,255,.75); }
/* The interval boundaries, on the spokes that actually divide the wedges. */
.bound { pointer-events: none; fill: var(--ink-dim); font-size: 8.5px;
         text-anchor: middle; dominant-baseline: central; opacity: .75; }
.spoke { stroke: var(--line); stroke-width: 1; pointer-events: none; }
/* Skip lives in the hole — the biggest single target on the dial, which is
   right for the answer that gets used most after the eight real ones. */
.skipw { fill: rgba(120,120,128,.14); cursor: pointer; transition: fill .12s ease; }
.skipw:hover { fill: rgba(120,120,128,.24); }
.skipw.on { fill: var(--maybe); }
.skipt { pointer-events: none; fill: color-mix(in srgb, var(--ink-dim) 70%, var(--ink));
         font-size: 12px; font-weight: 510; text-anchor: middle; dominant-baseline: central; }
.skipt.on { fill: #fff; }
.skipk { pointer-events: none; fill: var(--ink-dim); font-size: 9.5px;
         text-anchor: middle; dominant-baseline: central; }
.skipk.on { fill: rgba(255,255,255,.75); }
/* What the current pick MEANS, spelled out as the interval it stands for —
   the one line of prose the dial can't draw. */
#dial-read {
  margin: 2px 0 0; text-align: center; font-size: 12px; color: var(--ink-dim);
  font-variant-numeric: tabular-nums; min-height: 17px;
}
#dial-read b { color: var(--ink); font-weight: 600; }

/* ── nav / status ───────────────────────────────────────────────────────── */
/* Prev/next are the only nav left, so the joined pair spans the card as one
   segmented control. Explicit height rather than padding: the arrows are a
   single glyph and would otherwise size themselves off the line box —
   34px is the same height the name field and Start button use. */
#nav { display: flex; }
#seg { display: flex; flex: 1; }
#seg button {
  flex: 1; height: 34px; padding: 0; font-size: 17px; line-height: 1;
  border: 1px solid var(--line); background: transparent;
}
#seg button:first-child { border-radius: 8px 0 0 8px; }
#seg button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
#nav button:hover { border-color: var(--ink-dim); z-index: 1; }
#nav button:active { background: rgba(120,120,128,.14); }
#status { font-size: 12px; color: var(--ink-dim); }
#status:not(:empty) { margin-top: 9px; }
#status.err { color: var(--no); }
#status.ok { color: var(--yes); }
/* Frozen until this labeler's saved rows have arrived — otherwise a bucket
   picked in that window is discarded when the sync lands. The FRAME stays
   fully visible; only the controls that write are inert. */
body:not(.ready) #dial, body:not(.ready) #act-card { opacity: .4; pointer-events: none; }
#lock {
  display: none; padding: 8px 11px; border-radius: 9px;
  background: rgba(120,120,128,.14); color: var(--ink-dim);
  font-size: 12px; font-weight: 500;
}
body:not(.ready) #lock { display: block; }
#lock.err { background: rgba(255,59,48,.14); color: var(--no); }
@media (prefers-color-scheme: dark) { #lock { background: rgba(120,120,128,.24); } }
#lock:not(.err) { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { #lock:not(.err) { animation: none; } }

/* ── progress: the overview grid ─────────────────────────────────────────
   One dot per queue slot, in queue order — the same 20-col / 9px geometry
   and batch-of-100 gutter chin_tuck_4.0 uses, so the two tools' progress
   reads as the same object. A bar could only say how MUCH; this says
   WHICH, and it doubles as the way to jump to a frame. */
:root { --grid-h: 150px; }
/* The grid and its batch numbers scroll TOGETHER, so the scroller is the
   wrapper rather than the grid — otherwise the numbers stay put while the
   dots move and every label points at the wrong batch. */
.ovw { display: flex; gap: 6px; max-height: var(--grid-h);
       overflow-y: auto; overflow-x: hidden; margin-top: 9px; }
.ovn { flex: none; width: 18px; }
.ovn b {
  display: block; text-align: right;
  font: 500 9px/1 ui-monospace, "SF Mono", Menlo, monospace;
  color: var(--ink-dim);
}
.d4-grid { display: grid; grid-template-columns: repeat(20, 9px); gap: 3px;
           align-content: start; }
.d4-grid .d4 {
  width: 9px; height: 9px; border-radius: 2px; cursor: pointer;
  background: color-mix(in srgb, var(--ink-dim) 22%, transparent);
}
/* A gap every 100 frames, so a batch is countable without the gutter. */
.d4-grid .d4[data-batch] { margin-top: 7px; }
#ov .d4.dn { background: var(--yes); }
/* Skipped is a real answer, so it is a real shade — but a flat grey, not a
   fourth colour competing with green: "dealt with, nothing to learn." */
#ov .d4.sk { background: var(--ink-dim); }
.d4-grid .d4.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; column-gap: 10px; row-gap: 6px;
          font-size: 11px; color: var(--ink-dim); margin-top: 8px; }
.legend b { width: 8px; height: 8px; border-radius: 2px; display: inline-block;
            margin-right: 3px; }
#bar-text { font-size: 12.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
/* One cell per bucket, so the shape of the distribution is visible without
   reading any of the numbers. */
#dist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 8px;
        margin-top: 10px; font-size: 11px; font-variant-numeric: tabular-nums; }
#dist span { display: flex; justify-content: space-between; gap: 6px;
             color: var(--ink-dim); }
#dist span.has { color: var(--ink); }
#dist b { font-weight: 600; }

/* ── everyone's progress + bug report ─────────────────────────────────────
   Both ported from height_guard: same disclosure-pill shape, same panel
   markup and behaviour. */
@keyframes clue-in {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: none; }
}
#util-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
#team-btn, #bugreport-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent;
  font-size: 12px; font-weight: 500; color: var(--ink-dim);
  transition: background .12s ease, color .12s ease, border-color .12s ease;
}
#team-btn:hover:not(:disabled), #bugreport-btn:hover { border-color: var(--ink-dim); color: var(--ink); }
#team-btn:disabled { opacity: .4; cursor: default; }
#team-btn[aria-expanded="true"], #bugreport-btn[aria-expanded="true"] {
  background: var(--open-bg); border-color: var(--open-line); color: var(--open-ink);
}
#team-btn svg, #bugreport-btn svg { width: 13px; height: 13px; flex: none; }
#team-chev, #bugreport-chev { transition: transform .2s ease; }
#team-btn[aria-expanded="true"] #team-chev,
#bugreport-btn[aria-expanded="true"] #bugreport-chev { transform: rotate(180deg); }
@media (prefers-reduced-motion: reduce) {
  #team-chev, #bugreport-chev { transition: none; }
  #team.on, #bugreport-panel.on { animation: none; }
}

#team { display: none; grid-template-columns: 1fr auto;
        column-gap: 10px; align-items: baseline; font-size: 13px; }
#team.on { display: grid; animation: clue-in .2s ease both; margin: 12px 0 6px; }
.who-n { display: flex; align-items: baseline; gap: 5px; min-width: 0; font-weight: 500; }
.who-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
         padding: 0; border: 0; background: none; font: inherit; color: inherit;
         text-align: left; }
.who-t:hover { text-decoration: underline; }
.who-chev { flex: none; width: 10px; height: 10px; color: var(--ink-dim);
            opacity: .55; pointer-events: none; transition: transform .15s ease; }
.who-chev svg { display: block; width: 10px; height: 10px; }
.who-n.open .who-chev { transform: rotate(180deg); }
.who-ranges { grid-column: 1 / -1; margin: -6px 0 12px;
              font: 500 10.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
              color: var(--ink-dim); word-break: break-word; }
.who-eye { flex: none; padding: 0; border: 0; background: none; line-height: 0;
           color: var(--ink-dim); opacity: 0; transition: opacity .12s ease; }
#team:hover .who-eye { opacity: .45; }
.who-eye:hover, .who-eye:focus-visible { opacity: 1; color: var(--ink); }
.who-eye svg { width: 13px; height: 13px; display: block; }
.who-hidden { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px;
              font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; }
.who-show-all { padding: 0; border: 0; background: none; font: inherit;
                color: var(--accent); font-weight: 500; }
.who-show-all:hover { text-decoration: underline; }
.who-c { font-variant-numeric: tabular-nums; font-weight: 500; }
.who-c s { color: var(--ink-dim); text-decoration: none; font-weight: 400; }
/* Not a progress bar — a MAP of the queue: each run of consecutive
   positions is drawn where it actually falls. */
.who-bar { grid-column: 1 / -1; position: relative; height: 3px; border-radius: 2px;
           background: rgba(120,120,128,.16); margin: 6px 0 12px; overflow: hidden; }
.who-bar:last-child { margin-bottom: 0; }
.who-bar i { position: absolute; top: 0; bottom: 0; border-radius: 1.5px;
             background: var(--ink-dim); min-width: 1.5px; }
.who-bar.approx i { opacity: .3; }
.who-me .who-n { color: var(--accent); font-weight: 600; }
.who-me .who-c { color: var(--accent); }
.who-me .who-bar i { background: var(--accent); }
#team-empty { grid-column: 1 / -1; font-size: 12px; color: var(--ink-dim); }

#bugreport-panel { display: none; }
#bugreport-panel.on { display: block; animation: clue-in .2s ease both; margin-top: 12px; }
#bugreport-context { margin: 0 0 8px; font-size: 11.5px; color: var(--ink-dim); }
#bugreport-text {
  display: block; width: 100%; min-height: 70px;
  border: 0; border-radius: 9px; resize: vertical;
  background: rgba(120,120,128,.12); color: var(--ink);
  padding: 9px 12px; font: inherit; font-size: 13px;
}
#bugreport-text::placeholder { color: var(--ink-dim); font-weight: 400; }
#bugreport-text:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (prefers-color-scheme: dark) { #bugreport-text { background: rgba(120,120,128,.24); } }
#bugreport-row { display: flex; align-items: center; justify-content: space-between;
                 gap: 10px; margin-top: 8px; }
#bugreport-note { font-size: 11.5px; color: var(--ink-dim); flex: 1; min-width: 0; }
#bugreport-note.ok { color: var(--yes); }
#bugreport-note.err { color: var(--no); }
#bugreport-send {
  flex: none; padding: 8px 16px; border: 0; border-radius: 9px;
  background: var(--accent); color: #fff; font-size: 13px; font-weight: 590;
}
#bugreport-send:disabled { opacity: .3; cursor: default; }
</style>
</head>
<body>

<div id="wrap">
  <div id="stage-card">
    <div id="stage"><img id="frame" alt=""></div>
    <div id="hint">scroll = zoom &middot; drag = pan &middot; double-click = reset</div>
    <div id="zoom-chip"><span id="zoom-pct">100%</span><button id="zoom-reset" type="button">Reset</button></div>
  </div>

  <div id="side">
    <div class="card">
      <p class="card-eyebrow">Labeler</p>
      <div id="name-row">
        <input id="labeler-input" placeholder="Your name" title="Your name"
               autocomplete="off" spellcheck="false">
        <button id="name-go" disabled>Start</button>
      </div>
      <div id="util-row">
        <button type="button" id="team-btn" aria-expanded="false" aria-controls="team"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M1.8 11.4V6.9M5.6 11.4V2.6M9.4 11.4V8.2M13 11.4V4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="team-label">Everyone&rsquo;s progress</span><svg id="team-chev" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" id="bugreport-btn" aria-expanded="false" aria-controls="bugreport-panel"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 4.4A2.4 2.4 0 0 1 4.4 2h5.2A2.4 2.4 0 0 1 12 4.4v3.3a2.4 2.4 0 0 1-2.4 2.4H6.3L3.6 12V9.7A2.4 2.4 0 0 1 2 7.6z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M7 4.6v2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="7" cy="8.5" r=".85" fill="currentColor"/></svg><span>Report a problem</span><svg id="bugreport-chev" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div id="team"><div id="team-empty">No labels saved yet</div></div>
      <div id="bugreport-panel">
        <p id="bugreport-context"></p>
        <textarea id="bugreport-text" maxlength="1000" placeholder="What's not working? We'll attach the frame you're on."></textarea>
        <div id="bugreport-row">
          <span id="bugreport-note"></span>
          <button type="button" id="bugreport-send" disabled>Send</button>
        </div>
      </div>
    </div>

    <div class="card" id="id-card">
      <p class="card-eyebrow">Frame <span id="id-pos" style="text-transform:none;letter-spacing:0">&mdash;</span></p>
      <span class="idl">Video</span>
      <span class="idv" id="id-video">&mdash;</span>
      <button class="idc" data-copy="id-video" type="button" title="Copy video name" aria-label="Copy video name"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="4.6" y="4.6" width="7.8" height="7.8" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M9.4 4.6V3.2a1.6 1.6 0 0 0-1.6-1.6H3.2a1.6 1.6 0 0 0-1.6 1.6v4.6a1.6 1.6 0 0 0 1.6 1.6h1.4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <span class="idl">Round</span>
      <span class="idv" id="id-round">&mdash;</span>
      <button class="idc" data-copy="id-round" type="button" title="Copy round" aria-label="Copy round"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="4.6" y="4.6" width="7.8" height="7.8" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M9.4 4.6V3.2a1.6 1.6 0 0 0-1.6-1.6H3.2a1.6 1.6 0 0 0-1.6 1.6v4.6a1.6 1.6 0 0 0 1.6 1.6h1.4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <span class="idl">Frame</span>
      <span class="idv" id="id-frame">&mdash;</span>
      <button class="idc" data-copy="id-frame" type="button" title="Copy frame" aria-label="Copy frame"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="4.6" y="4.6" width="7.8" height="7.8" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M9.4 4.6V3.2a1.6 1.6 0 0 0-1.6-1.6H3.2a1.6 1.6 0 0 0-1.6 1.6v4.6a1.6 1.6 0 0 0 1.6 1.6h1.4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <span class="idl">Time</span>
      <span class="idv" id="id-pts">&mdash;</span>
      <button class="idc" data-copy="id-pts" type="button" title="Copy timestamp" aria-label="Copy timestamp"><svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="4.6" y="4.6" width="7.8" height="7.8" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M9.4 4.6V3.2a1.6 1.6 0 0 0-1.6-1.6H3.2a1.6 1.6 0 0 0-1.6 1.6v4.6a1.6 1.6 0 0 0 1.6 1.6h1.4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
    </div>

    <div class="card">
      <p class="card-eyebrow">Torso rotation &middot; vs. camera</p>
      <div id="dial-wrap"><svg id="dial" viewBox="0 0 300 300" role="group" aria-label="Torso angle bucket"></svg></div>
      <p id="dial-read">&mdash;</p>
    </div>

    <div class="card" id="act-card">
      <div id="lock">Loading your labels&hellip;</div>
      <div id="nav">
        <div id="seg">
          <button id="prev" title="Previous frame (←)" aria-label="Previous frame">&lsaquo;</button>
          <button id="next" title="Next frame (→)" aria-label="Next frame">&rsaquo;</button>
        </div>
      </div>
      <div id="status"></div>
    </div>

    <div class="card">
      <p class="card-eyebrow">Progress</p>
      <div id="bar-text">&mdash;</div>
      <div class="ovw"><div class="ovn"></div><div id="ov" class="d4-grid"></div></div>
      <div class="legend">
        <span><b style="background:var(--yes)"></b>labelled</span>
        <span><b style="background:var(--ink-dim)"></b>can&rsquo;t tell</span>
        <span><b style="background:color-mix(in srgb, var(--ink-dim) 22%, transparent)"></b>not yet</span>
      </div>
      <div id="dist"></div>
    </div>
  </div>
</div>

<script src="../shared/labeler_name.js"></script>
<script src="torso_angle.js?v=10"></script>
</body>
</html>

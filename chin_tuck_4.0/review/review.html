<!doctype html>
<meta charset="utf-8">
<title>Chin / shoulder review — model vs labelers</title>
<link rel="stylesheet" href="../../shared/style.css">
<style>
  body { margin: 0; padding: 14px; }
  .bar { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
  .fld { display: flex; flex-direction: column; gap: 3px; }
  .fld label { font-size: 11px; color: #999; }
  select, input[type=range] { min-width: 150px; }
  #video { min-width: 340px; max-width: 46vw; }
  .checks { display: flex; gap: 12px; align-items: center; }
  .checks label { display: flex; gap: 4px; align-items: center; cursor: pointer; font-size: 12px; }
  .wrap { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  #stage { background: #111; border: 1px solid #333; border-radius: 4px; max-width: 100%; }
  .side { min-width: 300px; flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 5px; margin: 0 10px 6px 0; font-size: 12px; }
  .chip i, td i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #2a2a2a; }
  th { color: #999; font-weight: 500; }
  td:not(:first-child), th:not(:first-child) { text-align: right; }
  .muted { color: #777; }
  .err { color: #ff5d6c; }
  .small { font-size: 12px; }
  .nav { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
</style>

<h2 style="margin:0 0 4px">Chin / shoulder review</h2>
<p class="small muted" style="margin:0 0 12px;max-width:820px">
  Our estimates against the labelers' clicks, on any variant. Model points are
  cached by the backend (they need the pose caches and the facing model);
  the clicks are fetched live, so new labels show up on reload. ← → steps
  frames.
</p>

<div class="bar">
  <div class="fld"><label>variant (axis · frames)</label><select id="variant"></select></div>
  <div class="fld"><label>point</label>
    <select id="point">
      <option value="both">chin + shoulder</option>
      <option value="chin">chin</option>
      <option value="shoulder">shoulder</option>
    </select></div>
  <div class="fld"><label>video</label><select id="video"></select></div>
  <div class="fld"><label>magnifier <span id="zoomv">6×</span></label>
    <input type="range" id="zoom" min="2" max="16" step="1" value="6"></div>
  <div class="checks">
    <label><input type="checkbox" id="gt"> labelers' median</label>
    <label><input type="checkbox" id="all"> every click</label>
  </div>
</div>

<div class="wrap">
  <div>
    <canvas id="stage" width="900" height="620"></canvas>
    <div class="nav">
      <button id="prev" class="btn small">◀ prev</button>
      <button id="next" class="btn small">next ▶</button>
      <span class="small muted" id="pos">—</span>
    </div>
  </div>
  <div class="side">
    <div id="legend"></div>
    <div id="hud"></div>
  </div>
</div>

<script type="module" src="review.js"></script>
